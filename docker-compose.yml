# BooklyAI — single-host stack for EC2 (FE + BE + Postgres + Nginx)
#
# Usage on the server:
#   cp .env.deploy.example .env
#   # edit .env with your domain / secrets
#   docker compose up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-booklyai}
    volumes:
      - booklyai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bookly

  api:
    build:
      context: ./BooklyAI-BE
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-booklyai}?schema=public
      FRONTEND_URL: ${APP_URL}
      PUBLIC_API_URL: ${APP_URL}
    volumes:
      - booklyai_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bookly

  web:
    build:
      context: ./BookLyAI-FE
      args:
        NEXT_PUBLIC_API_URL: ${APP_URL}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
        NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID: ${NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      - api
    networks:
      - bookly

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
    networks:
      - bookly

volumes:
  booklyai_pgdata:
  booklyai_uploads:

networks:
  bookly:
    driver: bridge
