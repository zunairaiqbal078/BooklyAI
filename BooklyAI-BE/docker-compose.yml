services:
  postgres:
    image: postgres:16-alpine
    container_name: booklyai-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: booklyai
    volumes:
      - booklyai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d booklyai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  booklyai_pgdata:
